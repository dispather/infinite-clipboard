<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Infinite Clipboard — Concept D (Squircle Monogram)">
  <!-- iOS 스타일 squircle(수퍼타원) 배경 + 흰색 ∞ 모노그램 -->

  <!-- squircle (rx가 크면 수퍼타원에 가까움) — 배경이 상태색 -->
  <rect x="16" y="16" width="224" height="224" rx="56"
        fill="var(--accent, #10b981)"/>

  <!-- 상단 하이라이트 그라디언트(미세) — 광택 감 -->
  <defs>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="white" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#gloss)"/>

  <!-- ∞ 모노그램 — 크고 뚜렷하게. stroke 두께 ~ 24px -->
  <g transform="translate(40 60) scale(11.5)"
     fill="none" stroke="white"
     stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 12c-2-2.67-4-4-6-4a4 4 0 1 0 0 8c2 0 4-1.33 6-4Zm0 0c2 2.67 4 4 6 4a4 4 0 0 0 0-8c-2 0-4 1.33-6 4Z"/>
  </g>
</svg>
