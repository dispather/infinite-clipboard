# 단위/통합 테스트 CI — pytest 회귀 게이트.
#
# build.yml(빌드 전용)·spike-lazy-clipboard.yml(스파이크)과 별개.
# main push / PR / 수동 실행 시 전체 pytest 스위트를 검증한다.
#
# v3.0 lazy clipboard 검증 안전망: Linux 잡은 Xvfb(가상 X11) + python-xlib 로
# 돌려, X11 lazy 백엔드의 selection-owner round-trip 테스트가 자동으로 함께 검증된다
# (이 환경의 헤드리스 한계를 CI 가 보완 — 함정 메모리 참조).
# Wayland 백엔드 round-trip 은 linux-wayland 잡(headless sway + pywayland)이 검증한다.
# _proto 바인딩은 repo 에 vendoring(core/_wayland_proto/)되어 있어 scanner 생성 불필요 —
# pywayland 런타임만 설치하면 됨. sway 가 ext-data-control 미광고면 테스트가 graceful skip
# (실제 kwin 로컬 PASS 가 권위 결과 — best-effort 잡).

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# 한글 로그/assert 메시지가 stdout 으로 나가므로 UTF-8 강제
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  linux:
    name: Linux pytest (Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install system deps (X11 가상 디스플레이)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xclip x11-utils
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # 런타임 공통 deps + 테스트 + X11 lazy 백엔드용 python-xlib
          python -m pip install -r requirements.txt
          python -m pip install pytest python-xlib
      - name: Run pytest (Xvfb)
        # xvfb-run 으로 가상 X11 제공 — 디스플레이 필요한 X11 백엔드 테스트도 동작
        run: xvfb-run -a python -m pytest tests/ -v

  linux-wayland:
    name: Linux Wayland (headless sway, best-effort)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install system deps (headless sway + wl-clipboard)
        run: |
          sudo apt-get update
          # libwayland-*: pip 가 pywayland 를 소스 빌드/런타임 바인딩(cffi)할 때 필요.
          # _proto 바인딩은 repo 에 vendoring 되어 있어 wayland-protocols/scanner 불필요.
          sudo apt-get install -y sway wl-clipboard libwayland-dev libwayland-bin
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pywayland
      - name: Run Wayland lazy tests under headless sway
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          export WLR_BACKENDS=headless
          export WLR_LIBINPUT_NO_DEVICES=1
          export WLR_RENDERER=pixman
          export LIBSEAT_BACKEND=noop
          sway > /tmp/sway.log 2>&1 &
          for i in $(seq 1 40); do
            sock=$(ls "$XDG_RUNTIME_DIR"/wayland-* 2>/dev/null | grep -v '\.lock' | head -1) && [ -n "$sock" ] && break
            sleep 0.5
          done
          if [ -z "$sock" ]; then
            echo "headless sway 미기동 (CI 환경 한계) — Wayland 테스트 skip"
            cat /tmp/sway.log || true
            echo "- **linux-wayland**: sway 미기동 — Wayland round-trip skip. 실 kwin 로컬 PASS 가 권위." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          export WAYLAND_DISPLAY=$(basename "$sock")
          # sway 가 ext-data-control 미광고면 test_lazy_wayland 가 graceful skip (false FAIL 회피)
          python -m pytest tests/test_lazy_wayland.py -v

  windows:
    name: Windows (delayed render)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python deps
        # core.lazy_win 이 core.clipboard_manager.WINDOWS_CLIPBOARD_LOCK 을 import 하는데
        # clipboard_manager 최상단이 `from PIL import Image` 라 pillow 도 필요 (2026-07-04 CI 5-fail 수정)
        # Windows-Toasts: core.notify_win (알림 받기/무시 액션 버튼, 2026-07-10)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pywin32 "pillow>=12.2.0" Windows-Toasts
      - name: Run Windows lazy tests (delayed render round-trip)
        # S0 미결(대용량 GetClipboardData NULL)이 프로덕션 블로킹 PumpMessages 루프에서
        # 해소되는지 검증하는 핵심 잡 — 특히 test_win_large_payload(~1MB CF/PNG delayed render).
        run: python -m pytest tests/test_lazy_win.py -v
      - name: Run Windows actionable-notify tests (Windows-Toasts)
        # 이 개발 환경엔 Windows 가 없어 core/notify_win.py 는 이 CI 잡이 유일한
        # 실 Windows 검증 수단 — 실제 InteractableWindowsToaster.show_toast 호출 +
        # on_activated 받기/무시 디스패치 로직 검증 (2026-07-10).
        run: python -m pytest tests/test_notify_win.py -v

  macos:
    name: macOS (NSPasteboard data provider)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python deps
        # test_lazy_mac 은 core.lazy_mac(+stdlib) + pyobjc-framework-Cocoa 만 필요.
        # pyobjc-framework-UserNotifications: core.notify_mac (알림 받기/무시 액션
        # 버튼, 2026-07-10) — UNUserNotificationCenter 는 코드 서명된 번들만 알림
        # 권한을 주므로, 이 CI(서명 안 된 python3 프로세스)에선 is_supported()=False
        # 로 저하하는 게 정상. 그래도 pyobjc 브리징 임포트/호출 자체가 깨지지
        # 않는지, 그리고 OS 권한과 무관한 액션 디스패치 로직(_handle_action)은
        # 여기서 결정적으로 검증된다 — tests/test_notify_mac.py 주석 참조.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyobjc-framework-Cocoa pyobjc-framework-UserNotifications
      - name: Run macOS lazy tests (NSPasteboard data provider round-trip)
        # 백그라운드 런루프 스레드에서 provideDataForType 콜백이 발화하는지(프로덕션 스레딩
        # 모델) + data-lazy(이미지 public.png / 파일 public.file-url) round-trip 검증.
        run: python -m pytest tests/test_lazy_mac.py -v
      - name: Run macOS actionable-notify tests (UNUserNotificationCenter)
        run: python -m pytest tests/test_notify_mac.py -v
