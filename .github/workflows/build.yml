name: Build (Windows + Linux + macOS)

# 트리거:
#   - tag push `v*` (예: v2.3.2)        → 빌드 + GitHub Releases draft 생성/attach
#   - workflow_dispatch (수동 실행)      → 빌드만 (artifact 만 남김)
#
# Phase 1: Windows + Linux ✅
# Phase 2: macOS (Apple Silicon, macos-14) — 코드 서명 없음, 사용자 1회 quarantine 해제 필요
# 빌드 산출물은 GitHub Actions artifact 로 항상 업로드, tag 빌드일 때만 Release 에 첨부.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 동일 ref 의 중복 실행 자동 취소
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Windows: windows-latest + Python 3.12 + Inno Setup
  # build_win.bat 를 그대로 호출. IC_BUILD_DIR override 하지 않는다 —
  # installer.iss 가 GetEnv("LOCALAPPDATA") 로 SourceDir/OutputDir 를
  # 결정하는데 build_win.bat 는 ISCC 에 /DSourceDir 를 안 넘기므로
  # PyInstaller 와 Inno Setup 의 작업 폴더가 같은 LOCALAPPDATA 트리에
  # 있어야 한다. 빌드 후 산출물만 workspace 로 복사해 upload.
  # ─────────────────────────────────────────────────────────────────────
  windows:
    name: Windows build
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        # .gitattributes 의 *.bat eol=crlf 강제 → 함정 #21(a) CRLF 보장.

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements_win.txt

      - name: Install Inno Setup
        # chocolatey 가 windows-latest 에 사전 설치되어 있음.
        # ISCC.exe → "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" 로 떨어짐 →
        # build_win.bat 의 ISCC 자동 탐색 [3순위] 가 hit.
        run: choco install innosetup -y --no-progress
        shell: pwsh

      - name: Show env
        run: |
          python --version
          pip --version
          echo LOCALAPPDATA=%LOCALAPPDATA%

      - name: Run build_win.bat
        # IC_BUILD_DIR 미지정 → default `%LOCALAPPDATA%\InfiniteClipboard-Build\`.
        # 마지막 `pause` 는 stdin 이 non-interactive 라 즉시 통과.
        run: build\build_win.bat

      - name: Stage installer to workspace
        # %LOCALAPPDATA% 가 user 이름 (`runneradmin`) 에 묶여 있어 upload-artifact
        # path 에 직접 박지 않는다. workspace 로 명시 복사 후 업로드.
        run: |
          mkdir "%GITHUB_WORKSPACE%\artifacts"
          copy "%LOCALAPPDATA%\InfiniteClipboard-Build\installer\infinite-clipboard-setup-*.exe" "%GITHUB_WORKSPACE%\artifacts\"
          dir "%GITHUB_WORKSPACE%\artifacts\"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ github.workspace }}\artifacts\infinite-clipboard-setup-*.exe
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # Linux: archlinux container 안에서 build_linux.sh 호출
  # ubuntu-latest 는 makepkg/pacman 없음 → archlinux base-devel 필수.
  # makepkg 는 root 거부 → 비-root user `builder` 생성.
  # ─────────────────────────────────────────────────────────────────────
  linux:
    name: Linux build (Arch)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      # ── Cache restore (이 step 들은 매번 실행되지만 cache 가 비어있으면
      #    no-op. save 는 job 종료 시 post-hook 으로 자동 수행) ─────────
      - name: Restore pacman package cache
        # /var/cache/pacman/pkg/ 에 다운로드된 .pkg.tar.zst 가 남아있으면
        # `pacman -S` 가 mirror 다운로드 skip. db cache (/var/lib/pacman/sync)
        # 는 Arch partial upgrade 함정 위험으로 일부러 제외 — DB 는 매번 sync.
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: pacman-pkg-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            pacman-pkg-

      - name: Install system dependencies
        # 미니멀 컨테이너 → pacman db sync + 런타임/빌드 deps 모두 설치.
        #
        # 함정 #7 의 확장형 — PyInstaller 가 --system-site-packages venv 의
        # GI/typelib 을 번들에 포함하려면 *빌드 시점* 시스템에 해당 라이브러리가
        # 실제로 있어야 한다. base-devel 만으론 부족:
        #   - gtk3:             Gtk-3.0.typelib + libgtk-3.so (AppIndicator 의존)
        #   - gdk-pixbuf2:      이미지 로더 (트레이 PNG 아이콘 디코딩)
        #   - libappindicator-gtk3 (provide name of libappindicator):
        #                       AppIndicator3-0.1.typelib + libappindicator3.so.1
        #                       — pystray 의 appindicator 백엔드가 import
        #   - python-dbus:      _dbus_bindings.so (트레이 D-Bus 통신)
        # 이걸 빼면 KDE Plasma Wayland 등 SNI 기반 DE 에서 트레이 silent fail
        # (로컬 빌드 산출물은 KDE 호스트에서 빌드돼 자연스럽게 포함됐던 것).
        #
        # tk:        customtkinter 의 PIL._tkinter_finder 참조 (함정 #6).
        # librsvg:   generate_icons.sh 의 rsvg-convert.
        # git:       actions/checkout 이 git 바이너리 사용.
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            git sudo \
            python python-pip \
            wl-clipboard xclip \
            python-gobject libayatana-appindicator \
            gtk3 gdk-pixbuf2 libappindicator-gtk3 python-dbus \
            librsvg \
            tk

      - name: Create non-root build user
        # makepkg 는 EUID=0 거부. NOPASSWD + env_keep 으로 GITHUB_* / IC_BUILD_DIR
        # 전달 가능하게 설정 (sudo 의 기본 동작은 env reset).
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          echo 'Defaults env_keep += "IC_BUILD_DIR GITHUB_WORKSPACE HOME PATH"' >> /etc/sudoers.d/builder

      - name: Restore pip cache
        # builder 가 pip 을 호출하므로 cache 는 /home/builder/.cache/pip 로 떨어진다.
        # 다음 step 에서 chown 해줘야 builder 가 실제로 쓸 수 있음 (cache 복원은 root 권한).
        uses: actions/cache@v4
        with:
          path: /home/builder/.cache/pip
          key: pip-linux-${{ hashFiles('requirements.txt', 'requirements_linux.txt') }}
          restore-keys: |
            pip-linux-

      - name: Fix pip cache ownership
        run: |
          mkdir -p /home/builder/.cache/pip
          chown -R builder:builder /home/builder/.cache

      - name: Checkout
        uses: actions/checkout@v5

      - name: Fix workspace ownership
        run: chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Run build_linux.sh as builder
        # IC_BUILD_DIR 을 workspace 안으로 둬서 upload-artifact 가 잡을 수 있게 함.
        # build_linux.sh 는 IC_BUILD_DIR 을 spec/makepkg 양쪽에 일관 적용.
        env:
          IC_BUILD_DIR: ${{ github.workspace }}/ic-build
        run: |
          sudo -u builder --preserve-env=IC_BUILD_DIR,GITHUB_WORKSPACE bash -c '
            cd "$GITHUB_WORKSPACE"
            bash build/build_linux.sh
          '

      - name: List build outputs
        run: ls -la "$GITHUB_WORKSPACE/ic-build/"
        continue-on-error: true

      - name: Upload pacman package artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arch-package
          path: ${{ github.workspace }}/ic-build/infinite-clipboard-*-x86_64.pkg.tar.zst
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # macOS (Apple Silicon): macos-14 runner.
  # build_mac.sh 가 pyenv + tcl-tk@8 + Python 3.12 (Tk 8.6 링크) 를 자동
  # 부트스트랩한다. 함정 #11 (Tk 9.0 세그폴트) 회피용.
  # Python 빌드는 매번 10-15분 소요 → ~/.pyenv/versions cache 가 결정적.
  # 코드 서명 없음 — 사용자가 DMG 다운로드 후 `xattr -dr com.apple.quarantine`
  # 으로 Gatekeeper 1회 우회 필요.
  # ─────────────────────────────────────────────────────────────────────
  macos:
    name: macOS build (Apple Silicon)
    runs-on: macos-14
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build tools (uv + pyenv + tcl-tk@8)
        # brew 는 macos-14 에 사전 설치. pyenv 와 uv 는 build_mac.sh 가 요구.
        # tcl-tk@8 은 함정 #11 회피용 Python 빌드 의존성.
        run: |
          brew update
          brew install uv pyenv tcl-tk@8

      - name: Restore pyenv Python 3.12 cache
        # build_mac.sh 가 pyenv install 3.12.13 을 tcl-tk@8 링크 옵션으로
        # 호출. Python 소스 컴파일 10-15분 → cache hit 시 0초로 단축.
        # cache key 는 Python 버전 + tcl-tk 버전 + runner OS/arch 조합.
        # tcl-tk@8 메이저 변경 시 v2 로 bump.
        uses: actions/cache@v4
        with:
          path: ~/.pyenv/versions/3.12.13
          key: pyenv-py312-tcltk8-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Restore uv cache
        # pyinstaller / pillow / customtkinter / pystray 등 pip 패키지 캐시.
        # macOS 에서 uv 의 default cache 는 ~/Library/Caches/uv
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/uv
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml', 'requirements_mac.txt') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ runner.arch }}-

      - name: Run build_mac.sh
        # IC_BUILD_DIR 을 workspace 안으로 override (Linux job 과 동일 패턴).
        # build_mac.sh 가 .app 까지만 생성. DMG 는 다음 step.
        env:
          IC_BUILD_DIR: ${{ github.workspace }}/ic-build
        run: bash build/build_mac.sh

      - name: Run make_dmg.sh
        env:
          IC_BUILD_DIR: ${{ github.workspace }}/ic-build
        run: bash build/make_dmg.sh

      - name: List build outputs
        env:
          IC_BUILD_DIR: ${{ github.workspace }}/ic-build
        run: ls -la "$IC_BUILD_DIR/dist/"
        continue-on-error: true

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          # 공백 포함 파일명 (`Infinite Clipboard <ver>.dmg`) — glob 으로 매칭.
          path: ${{ github.workspace }}/ic-build/dist/Infinite Clipboard *.dmg
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # Release: tag push 일 때만 실행. draft 로 둬서 사용자가 changelog 검토 후
  # 직접 publish 하도록 한다 (자동 publish 시 실수 복구 어려움).
  # ─────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release (draft)
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-arch-package
          path: artifacts/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/infinite-clipboard-setup-*.exe
            artifacts/infinite-clipboard-*-x86_64.pkg.tar.zst
            artifacts/Infinite Clipboard *.dmg
